# Ready-Mix world simulator -- every number here is SIMULATED or ASSUMED
# (see data_dictionary.csv written next to each dataset). Nothing in this
# file is real operational data.

simulation:
  seed: 42
  date: "2026-10-01"
  day_start: "05:00"            # first traffic slot
  day_end: "20:00"
  step_minutes: 5               # rolling-horizon step used from Loop 2 on

plant:
  plant_id: P001
  plant_name: Plant_A
  latitude: 13.7563             # central Bangkok as a neutral anchor, not a real plant
  longitude: 100.5018
  loading_bays: 2
  load_time_min: 8
  wash_time_min: 10             # drum rinse before the next load
  operating_start: "06:00"
  operating_end: "18:00"

sites:
  count: 10
  radius_km: [3.0, 18.0]        # straight-line distance from the plant
  reliability_mix:              # hidden trait, never written to sites.csv
    good:    {share: 0.4, p_late: 0.15, late_mean_min: 12, late_sd_min: 6}
    average: {share: 0.4, p_late: 0.35, late_mean_min: 20, late_sd_min: 10}
    poor:    {share: 0.2, p_late: 0.60, late_mean_min: 35, late_sd_min: 15}
  on_time_delay_min: {mean: -2, sd: 4, min: -15, max: 5}
  history_pours: 60             # past pours sampled to build historical_delay_mean/std
  pump_share: 0.7
  crew_size: [6, 12]

vehicles:
  count: 15
  capacity_m3: 6.0
  available_from: ["06:00", "07:30"]
  fuel_type: diesel
  fuel_efficiency_km_l: [2.5, 3.5]   # placeholder until Loop 8 finds a source
  idle_fuel_l_h: [2.5, 3.5]          # placeholder until Loop 8 finds a source
  max_shift_min: 600

orders:
  count: 30
  volume_m3: {min: 4.0, max: 40.0, lognormal_mean: 2.2, lognormal_sd: 0.6, step: 0.5}   # 2.5 in loop01-v1; lowered in Loop 2 (peaks overloaded)
  requested_start: ["07:00", "15:00"]   # 14:00 in loop01-v1
  start_step_min: 15
  target_interval_min: [15, 30]
  unload_min_pump: [12, 18]
  unload_min_chute: [15, 25]
  window_slack_min: 30
  concrete_types: [M25, M30, M35, M40]
  priority: [1, 5]
  trip_volume_step_m3: 0.25     # equal split in 0.25 m3 steps keeps every trip > capacity/2

travel:
  circuity: 1.3                 # road km / straight-line km
  free_flow_kmh: 40
  hourly_multiplier:            # hour -> multiplier before scenario scaling
    5: 0.95
    6: 1.20
    7: 1.55
    8: 1.60
    9: 1.30
    10: 1.15
    11: 1.15
    12: 1.20
    13: 1.15
    14: 1.15
    15: 1.25
    16: 1.55
    17: 1.65
    18: 1.45
    19: 1.20
  edge_noise_sd: 0.08           # lognormal noise per edge and hour

service:
  actual_unload_noise_sd: 0.15  # lognormal around estimated_unload_min

site_state:                     # observable pre-pour signals (Loop 3); all ASSUMED
  lookback_min: 120             # first observation = planned ready - 120 min
  horizon_after_planned_min: 240
  prep_duration_min: [60, 150]  # site preparation before it is ready; unknown to the planner
  crew_arrival_sd_min: 5        # crew shows up around the start of preparation
  report_every_min: [15, 30]    # foreman progress reports arrive at irregular times
  progress_noise_pct: 8
  progress_round_pct: 10
  pump_repair_before_ready_min: [10, 30]

plausibility:
  fleet_load_ratio: [0.50, 0.85]  # was [0.60, 0.95]; Loop 2 showed a day-average of 0.8 already overloads the peaks
