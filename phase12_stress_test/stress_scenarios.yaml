# Phase 12 stress scenarios. defaults + magnitudes are copied unchanged from
# readymix/config/scenarios.yaml; that file is NOT edited so Phase 6-11 datasets stay byte-identical.
# X7_fleet_shortage uses simulation_fleet10.yaml (10 trucks instead of 15).
defaults:
  traffic_excess_scale: 1.0
  weather: CLEAR
  demand_scale: 1.0
  extra_orders: 0
  traffic_spikes: 0
  site_delays: 0
  pump_failures: 0
  truck_breakdowns: 0
  service_slowdowns: 0
  demand_changes: 0
  surprise_late_reliable: 0
  surprise_early_poor: 0
magnitudes:
  traffic_spike:
    extra:
    - 0.3
    - 0.5
    hours:
    - 1
    - 2
  site_delay_min:
  - 30
  - 60
  pump_failure_min:
  - 45
  - 90
  service_slowdown_factor:
  - 1.2
  - 1.4
  demand_change_factor:
  - 0.8
  - 1.3
  surprise_late_min:
  - 40
  - 70
  surprise_early_min:
  - 15
  - 30
  rain:
    traffic_factor: 1.1
    extra_delay_min:
    - 5
    - 15
  notice_before_ready_min:
  - 30
  - 90
scenarios:
  X1_demand_plus50:
    demand_scale: 1.5
  X2_many_breakdowns:
    truck_breakdowns: 4
  X3_site_chaos:
    site_delays: 6
    pump_failures: 3
    service_slowdowns: 3
  X4_ai_badly_wrong:
    surprise_late_reliable: 5
    surprise_early_poor: 5
  X5_traffic_extreme:
    traffic_excess_scale: 2.5
    traffic_spikes: 4
    weather: RAIN
  X6_everything:
    demand_scale: 1.3
    truck_breakdowns: 3
    site_delays: 4
    pump_failures: 2
    traffic_excess_scale: 1.8
    traffic_spikes: 2
    weather: RAIN
    surprise_late_reliable: 3
    surprise_early_poor: 3
    demand_changes: 3
  X7_fleet_shortage: {}
